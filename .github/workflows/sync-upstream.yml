name: Sync upstream
on:
  schedule:
    - cron: '0 */6 * * *'   # 每 6 小时一次，UTC 时间
  workflow_dispatch:        # 支持网页手动点一下立刻跑
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream into fork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch upstream
          git checkout main
          git merge --no-edit upstream/main
          git push origin main

      - name: 冲突时开 issue 提醒
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '上游同步失败，需手动处理',
              body: '运行日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            })
